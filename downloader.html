    const btn = document.getElementById('startBtn');
    const status = document.getElementById('status');
    const countDisplay = document.getElementById('countDisplay');
    const pBar = document.getElementById('pBar');
    const pFill = document.getElementById('pFill');

    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      pBar.style.display = 'block';
      const zip = new JSZip();
      let successCount = 0;

      for (let i = 0; i < LOGO_DATA.length; i++) {
        const item = LOGO_DATA[i];
        status.textContent = `Fetching ${item.id}.svg...`;

        try {
          const res = await fetch(item.url);
          if (res.ok) {
            const svgText = await res.text();
            if (svgText.includes("<svg")) {
              zip.file(`${item.id}.svg`, svgText);
              successCount++;
            }
          }
        } catch (err) {
          console.warn(`Failed: ${item.id}`);
        }

        countDisplay.textContent = `${successCount} / ${LOGO_DATA.length} Saved`;
        pFill.style.width = `${((i + 1) / LOGO_DATA.length) * 100}%`;
        await sleep(40); // Pacing delay to bypass GitHub rate-limiting
      }

      status.textContent = "Packaging ZIP archive...";
      const content = await zip.generateAsync({ type: "blob" });
      saveAs(content, "brands.zip");
      status.textContent = `Done! ${successCount} verified full-color SVGs saved into brands.zip.`;
      btn.disabled = false;
    });
